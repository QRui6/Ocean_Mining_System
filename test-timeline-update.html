<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时间轴更新测试</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #1a1a1a;
            color: #00ff00;
            padding: 20px;
        }
        .test-section {
            background: #2a2a2a;
            border: 1px solid #00ff00;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
        }
        button {
            background: #00ff00;
            color: #000;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 3px;
        }
        button:hover {
            background: #00cc00;
        }
        .log {
            background: #000;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #333;
            max-height: 400px;
            overflow-y: auto;
            font-size: 12px;
        }
        .success { color: #00ff00; }
        .error { color: #ff0000; }
        .info { color: #00ccff; }
        .warning { color: #ffaa00; }
    </style>
</head>
<body>
    <h1>🧪 时间轴数据更新测试</h1>
    
    <div class="test-section">
        <h2>测试1: 后端API连通性</h2>
        <button onclick="testBackendAPI()">测试后端API</button>
        <div id="api-log" class="log"></div>
    </div>
    
    <div class="test-section">
        <h2>测试2: 不同时间索引的数据</h2>
        <button onclick="testTimeIndex(0)">加载索引 0</button>
        <button onclick="testTimeIndex(5)">加载索引 5</button>
        <button onclick="testTimeIndex(10)">加载索引 10</button>
        <button onclick="testTimeIndex(15)">加载索引 15</button>
        <div id="time-log" class="log"></div>
    </div>
    
    <div class="test-section">
        <h2>测试3: 数据差异对比</h2>
        <button onclick="compareTimeIndices()">对比索引 0 vs 5</button>
        <div id="compare-log" class="log"></div>
    </div>

    <script>
        const API_BASE = '/api/backend';
        
        function log(elementId, message, type = 'info') {
            const logDiv = document.getElementById(elementId);
            const timestamp = new Date().toLocaleTimeString();
            const className = type;
            logDiv.innerHTML += `<div class="${className}">[${timestamp}] ${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }
        
        async function testBackendAPI() {
            const logId = 'api-log';
            document.getElementById(logId).innerHTML = '';
            
            try {
                log(logId, '🔍 测试后端API连通性...', 'info');
                
                // 测试元数据接口
                log(logId, '📡 请求风场元数据...', 'info');
                const metaResponse = await fetch(`${API_BASE}/api/weather/metadata/wind`);
                
                if (!metaResponse.ok) {
                    throw new Error(`HTTP ${metaResponse.status}`);
                }
                
                const metaData = await metaResponse.json();
                log(logId, `✅ 元数据加载成功`, 'success');
                log(logId, `   - 数据帧数: ${metaData.data.frames}`, 'info');
                log(logId, `   - 时间步长: ${metaData.data.timeStepHours} 小时`, 'info');
                log(logId, `   - 网格大小: ${metaData.data.grid.lonSize} x ${metaData.data.grid.latSize}`, 'info');
                
                // 测试数据接口
                log(logId, '📡 请求风场数据 (索引 0)...', 'info');
                const dataResponse = await fetch(`${API_BASE}/api/weather/data/wind/0/binary`);
                
                if (!dataResponse.ok) {
                    throw new Error(`HTTP ${dataResponse.status}`);
                }
                
                const dataBuffer = await dataResponse.arrayBuffer();
                log(logId, `✅ 数据加载成功`, 'success');
                log(logId, `   - 数据大小: ${(dataBuffer.byteLength / 1024 / 1024).toFixed(2)} MB`, 'info');
                
                log(logId, '🎉 后端API测试通过！', 'success');
                
            } catch (error) {
                log(logId, `❌ 测试失败: ${error.message}`, 'error');
                console.error(error);
            }
        }
        
        async function testTimeIndex(index) {
            const logId = 'time-log';
            
            try {
                log(logId, `🔍 加载时间索引 ${index} 的数据...`, 'info');
                
                const startTime = performance.now();
                const response = await fetch(`${API_BASE}/api/weather/data/wind/${index}/binary`);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const arrayBuffer = await response.arrayBuffer();
                const loadTime = (performance.now() - startTime).toFixed(0);
                
                // 解析二进制数据
                const view = new DataView(arrayBuffer);
                const headerLength = view.getInt32(0, false);
                const headerBytes = new Uint8Array(arrayBuffer, 4, headerLength);
                const headerText = new TextDecoder().decode(headerBytes);
                const header = JSON.parse(headerText);
                
                // 计算数据偏移
                const totalHeaderSize = 4 + headerLength;
                const padding = (4 - (totalHeaderSize % 4)) % 4;
                const dataOffset = totalHeaderSize + padding;
                
                // 读取U和V数据
                const dataSize = header.width * header.height;
                const uArray = new Float32Array(arrayBuffer, dataOffset, dataSize);
                const vArray = new Float32Array(arrayBuffer, dataOffset + dataSize * 4, dataSize);
                
                // 计算统计信息
                let uSum = 0, vSum = 0;
                let uMin = Infinity, uMax = -Infinity;
                let vMin = Infinity, vMax = -Infinity;
                
                for (let i = 0; i < Math.min(1000, dataSize); i++) {
                    const u = uArray[i];
                    const v = vArray[i];
                    uSum += u;
                    vSum += v;
                    uMin = Math.min(uMin, u);
                    uMax = Math.max(uMax, u);
                    vMin = Math.min(vMin, v);
                    vMax = Math.max(vMax, v);
                }
                
                const uAvg = (uSum / 1000).toFixed(3);
                const vAvg = (vSum / 1000).toFixed(3);
                
                log(logId, `✅ 索引 ${index} 数据加载成功 (${loadTime}ms)`, 'success');
                log(logId, `   - 数据大小: ${(arrayBuffer.byteLength / 1024 / 1024).toFixed(2)} MB`, 'info');
                log(logId, `   - 网格: ${header.width} x ${header.height}`, 'info');
                log(logId, `   - U范围: ${header.uMin.toFixed(2)} ~ ${header.uMax.toFixed(2)} m/s`, 'info');
                log(logId, `   - V范围: ${header.vMin.toFixed(2)} ~ ${header.vMax.toFixed(2)} m/s`, 'info');
                log(logId, `   - U平均(前1000点): ${uAvg} m/s`, 'info');
                log(logId, `   - V平均(前1000点): ${vAvg} m/s`, 'info');
                log(logId, `   - 边界: ${JSON.stringify(header.bounds)}`, 'info');
                log(logId, '---', 'info');
                
            } catch (error) {
                log(logId, `❌ 加载索引 ${index} 失败: ${error.message}`, 'error');
                console.error(error);
            }
        }
        
        async function compareTimeIndices() {
            const logId = 'compare-log';
            document.getElementById(logId).innerHTML = '';
            
            try {
                log(logId, '🔍 对比时间索引 0 和 5 的数据...', 'info');
                
                // 加载索引0
                log(logId, '📡 加载索引 0...', 'info');
                const response0 = await fetch(`${API_BASE}/api/weather/data/wind/0/binary`);
                const buffer0 = await response0.arrayBuffer();
                const data0 = parseWindData(buffer0);
                
                // 加载索引5
                log(logId, '📡 加载索引 5...', 'info');
                const response5 = await fetch(`${API_BASE}/api/weather/data/wind/5/binary`);
                const buffer5 = await response5.arrayBuffer();
                const data5 = parseWindData(buffer5);
                
                // 对比数据
                log(logId, '📊 数据对比结果:', 'info');
                log(logId, `   索引 0 - U范围: ${data0.uMin.toFixed(2)} ~ ${data0.uMax.toFixed(2)}`, 'info');
                log(logId, `   索引 5 - U范围: ${data5.uMin.toFixed(2)} ~ ${data5.uMax.toFixed(2)}`, 'info');
                log(logId, `   索引 0 - V范围: ${data0.vMin.toFixed(2)} ~ ${data0.vMax.toFixed(2)}`, 'info');
                log(logId, `   索引 5 - V范围: ${data5.vMin.toFixed(2)} ~ ${data5.vMax.toFixed(2)}`, 'info');
                
                // 计算差异
                let diffCount = 0;
                let maxDiff = 0;
                const sampleSize = Math.min(10000, data0.u.length);
                
                for (let i = 0; i < sampleSize; i++) {
                    const uDiff = Math.abs(data0.u[i] - data5.u[i]);
                    const vDiff = Math.abs(data0.v[i] - data5.v[i]);
                    const totalDiff = Math.sqrt(uDiff * uDiff + vDiff * vDiff);
                    
                    if (totalDiff > 0.01) {
                        diffCount++;
                        maxDiff = Math.max(maxDiff, totalDiff);
                    }
                }
                
                const diffPercent = ((diffCount / sampleSize) * 100).toFixed(1);
                
                log(logId, `   差异点数: ${diffCount} / ${sampleSize} (${diffPercent}%)`, 'info');
                log(logId, `   最大差异: ${maxDiff.toFixed(3)} m/s`, 'info');
                
                if (diffCount > sampleSize * 0.1) {
                    log(logId, '✅ 数据确实不同！时间索引正常工作', 'success');
                } else {
                    log(logId, '⚠️  数据差异很小，可能是相同的数据', 'warning');
                }
                
            } catch (error) {
                log(logId, `❌ 对比失败: ${error.message}`, 'error');
                console.error(error);
            }
        }
        
        function parseWindData(arrayBuffer) {
            const view = new DataView(arrayBuffer);
            const headerLength = view.getInt32(0, false);
            const headerBytes = new Uint8Array(arrayBuffer, 4, headerLength);
            const headerText = new TextDecoder().decode(headerBytes);
            const header = JSON.parse(headerText);
            
            const totalHeaderSize = 4 + headerLength;
            const padding = (4 - (totalHeaderSize % 4)) % 4;
            const dataOffset = totalHeaderSize + padding;
            
            const dataSize = header.width * header.height;
            const u = new Float32Array(arrayBuffer, dataOffset, dataSize);
            const v = new Float32Array(arrayBuffer, dataOffset + dataSize * 4, dataSize);
            
            return {
                u: u,
                v: v,
                uMin: header.uMin,
                uMax: header.uMax,
                vMin: header.vMin,
                vMax: header.vMax,
                width: header.width,
                height: header.height
            };
        }
        
        // 页面加载时自动运行基础测试
        window.addEventListener('load', () => {
            console.log('🧪 时间轴更新测试页面已加载');
            console.log('💡 提示: 打开浏览器控制台查看详细日志');
        });
    </script>
</body>
</html>
