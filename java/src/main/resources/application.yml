spring:
  application:
    name: ship-monitoring-backend
  
  # 数据源配置
  datasource:
    url: jdbc:postgresql://localhost:5432/ship_monitoring?sslmode=disable
    username: postgres
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  # JPA配置
  jpa:
    database-platform: org.hibernate.spatial.dialect.postgis.PostgisPG95Dialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        show_sql: false
        jdbc:
          time_zone: UTC
    show-sql: false
  
  # 缓存配置
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=3600s
    cache-names:
      - weatherMetadata
      - weatherData
      - availableIndices
  
  # Jackson配置
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false

# 服务器配置
server:
  port: 8082
  address: 0.0.0.0  # 允许外部访问
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
    min-response-size: 1024

# 船讯网API配置
shipxy:
  api:
    base-url: https://api.shipxy.com
    api-key: ${SHIPXY_API_KEY:your_api_key_here}

# WebSocket配置
websocket:
  port: 8082
  path: /ws
  allowed-origins: "*"

# Webhook配置
webhook:
  path: /webhook/area
  public-url: ${PUBLIC_URL:http://localhost:8082}

# 定时任务配置
scheduler:
  ship-update:
    enabled: true
    fixed-rate: 600000  # 10分钟 = 600000毫秒

forecast:
  scheduler:
    enabled: true
    cron: "0 15 0,6,12,18 * * ?"
    zone: Asia/Shanghai
  warning:
    wind-warning: 20
    wind-critical: 25
    wave-warning: 4
    wave-critical: 6
    current-warning: 2

buoy:
  simulation:
    refresh-ms: 60000

# 气象数据配置
weather:
  data:
    path:
      wind: D:/project/public/wind_data
      ocean_current: D:/project/public/ocean_currents
      wave: D:/project/public/wave_data
  migration:
    auto-run: false  # 是否自动执行数据迁移

# 日志配置
logging:
  level:
    root: INFO
    com.oceanmining.monitoring: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
