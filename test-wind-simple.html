<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简单风场测试</title>
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.108/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.108/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; overflow: hidden; }
        #cesiumContainer { width: 100vw; height: 100vh; }
        #controls {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px;
            border-radius: 5px;
            z-index: 1000;
        }
        button {
            background: #06b6d4;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #0891b2;
        }
        #status {
            margin-top: 10px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div id="cesiumContainer"></div>
    <div id="controls">
        <h3>风场控制</h3>
        <button id="toggleWind">显示风场</button>
        <div id="status">状态: 未初始化</div>
    </div>

    <script type="module">
        const statusEl = document.getElementById('status');
        const toggleBtn = document.getElementById('toggleWind');
        
        function updateStatus(msg) {
            statusEl.textContent = '状态: ' + msg;
            console.log('📊', msg);
        }

        updateStatus('初始化 Cesium...');
        
        // 初始化 Cesium
        const viewer = new Cesium.Viewer('cesiumContainer', {
            animation: false,
            timeline: false,
            geocoder: false,
            homeButton: false,
            sceneModePicker: false,
            baseLayerPicker: false,
            navigationHelpButton: false,
            fullscreenButton: false
        });

        updateStatus('加载插件...');
        
        let windLayer = null;
        let isWindVisible = false;

        // 加载风场
        async function initWind() {
            try {
                updateStatus('加载 cesium-wind-layer 插件...');
                const { WindLayer } = await import('cesium-wind-layer');
                
                updateStatus('加载风场数据...');
                const response = await fetch('/data/wind_data_0701.json');
                const rawData = await response.json();
                
                updateStatus('转换数据格式...');
                const sparseData = rawData.wind;
                const bounds = {
                    west: Math.min(...sparseData.map(p => p.lon)),
                    east: Math.max(...sparseData.map(p => p.lon)),
                    south: Math.min(...sparseData.map(p => p.lat)),
                    north: Math.max(...sparseData.map(p => p.lat))
                };

                const resolution = 1.0;
                const nx = Math.ceil((bounds.east - bounds.west) / resolution) + 1;
                const ny = Math.ceil((bounds.north - bounds.south) / resolution) + 1;

                const uData = new Float32Array(nx * ny);
                const vData = new Float32Array(nx * ny);
                uData.fill(NaN);
                vData.fill(NaN);

                for (const point of sparseData) {
                    const i = Math.round((point.lon - bounds.west) / resolution);
                    const j = Math.round((point.lat - bounds.south) / resolution);
                    if (i >= 0 && i < nx && j >= 0 && j < ny) {
                        const index = j * nx + i;
                        uData[index] = point.u;
                        vData[index] = point.v;
                    }
                }

                const windData = {
                    u: { array: uData },
                    v: { array: vData },
                    width: nx,
                    height: ny,
                    bounds: bounds
                };

                updateStatus('创建 WindLayer...');
                windLayer = new WindLayer(viewer, windData, {
                    particleSystemOptions: {
                        maxParticles: 64 * 64,
                        particleHeight: 100.0,
                        fadeOpacity: 0.996,
                        dropRate: 0.003,
                        dropRateBump: 0.01,
                        speedFactor: 1.0,
                        lineWidth: 4.0
                    }
                });

                windLayer.show = true;
                isWindVisible = true;
                toggleBtn.textContent = '隐藏风场';
                
                updateStatus('✅ 风场已显示');

                // 飞到太平洋
                viewer.camera.flyTo({
                    destination: Cesium.Cartesian3.fromDegrees(-140.0, 10.0, 15000000),
                    duration: 2
                });

            } catch (error) {
                updateStatus('❌ 错误: ' + error.message);
                console.error('详细错误:', error);
            }
        }

        // 切换风场显示
        toggleBtn.addEventListener('click', async () => {
            if (!windLayer) {
                await initWind();
            } else {
                isWindVisible = !isWindVisible;
                windLayer.show = isWindVisible;
                toggleBtn.textContent = isWindVisible ? '隐藏风场' : '显示风场';
                updateStatus(isWindVisible ? '风场已显示' : '风场已隐藏');
            }
        });

        updateStatus('准备就绪，点击按钮显示风场');
    </script>
</body>
</html>
