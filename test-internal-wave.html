<!DOCTYPE html>
<html>
<head>
    <title>测试内波数据加载</title>
</head>
<body>
    <h1>测试内波数据加载</h1>
    <button onclick="testLoad()">加载内波数据</button>
    <pre id="output"></pre>

    <script type="module">
        import { loadGlobalInternalWaveData } from './src/utils/internalWaveLoader.js';

        window.testLoad = async function() {
            const output = document.getElementById('output');
            output.textContent = '正在加载...';
            
            try {
                const data = await loadGlobalInternalWaveData(0);
                output.textContent = JSON.stringify({
                    width: data.width,
                    height: data.height,
                    bounds: data.bounds,
                    u_min: data.u.min,
                    u_max: data.u.max,
                    v_min: data.v.min,
                    v_max: data.v.max,
                    u_array_length: data.u.array.length,
                    v_array_length: data.v.array.length
                }, null, 2);
            } catch (error) {
                output.textContent = '错误: ' + error.message + '\n' + error.stack;
            }
        };
    </script>
</body>
</html>
