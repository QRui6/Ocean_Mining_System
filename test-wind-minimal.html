<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>最小风场测试</title>
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.108/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.108/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <style>
        body { margin: 0; }
        #cesiumContainer { width: 100vw; height: 100vh; }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px;
            font-family: monospace;
            font-size: 12px;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div id="cesiumContainer"></div>
    <div id="info">加载中...</div>
    
    <script type="module">
        const info = document.getElementById('info');
        
        // 1. 创建 Viewer（不使用按需渲染）
        info.textContent = '1. 创建 Viewer...';
        const viewer = new Cesium.Viewer('cesiumContainer', {
            animation: false,
            timeline: false,
            baseLayerPicker: false,
            geocoder: false,
            homeButton: false,
            sceneModePicker: false,
            navigationHelpButton: false,
            fullscreenButton: false,
            // 关键：不使用按需渲染
            requestRenderMode: false
        });
        
        // 2. 加载插件
        info.textContent = '2. 加载插件...';
        const { WindLayer } = await import('cesium-wind-layer');
        info.textContent = '3. 插件加载成功';
        
        // 3. 创建简单的测试数据（10x10网格）
        info.textContent = '4. 创建测试数据...';
        const size = 10;
        const uData = new Float32Array(size * size);
        const vData = new Float32Array(size * size);
        
        // 填充简单的风场数据（向东吹）
        for (let i = 0; i < size * size; i++) {
            uData[i] = 5.0;  // 向东 5 m/s
            vData[i] = 0.0;  // 无南北分量
        }
        
        const windData = {
            u: { array: uData, min: 5, max: 5 },
            v: { array: vData, min: 0, max: 0 },
            width: size,
            height: size,
            bounds: {
                west: -180,
                south: -90,
                east: 180,
                north: 90
            }
        };
        
        // 4. 创建 WindLayer
        info.textContent = '5. 创建 WindLayer...';
        try {
            const windLayer = new WindLayer(viewer, windData, {
                particlesTextureSize: 64,
                particleHeight: 1000.0,
                lineWidth: { min: 1, max: 2 },
                lineLength: { min: 20, max: 100 },
                speedFactor: 1.0,
                dropRate: 0.003,
                dropRateBump: 0.001,
                colors: ['white'],
                dynamic: true
            });
            
            info.textContent = '6. WindLayer 创建成功';
            console.log('WindLayer:', windLayer);
            console.log('windLayer.show:', windLayer.show);
            
            // 5. 显示风场
            windLayer.show = true;
            info.textContent = '7. ✅ 风场已显示！应该能看到白色粒子';
            
            // 6. 飞到合适的视角
            viewer.camera.flyTo({
                destination: Cesium.Cartesian3.fromDegrees(0, 0, 20000000),
                duration: 2
            });
            
        } catch (error) {
            info.textContent = '❌ 错误: ' + error.message;
            console.error('详细错误:', error);
        }
    </script>
</body>
</html>
