<!DOCTYPE html>
<html>
<head>
    <title>Wind Data Test</title>
</head>
<body>
    <h1>Wind Data Format Test</h1>
    <pre id="output"></pre>
    
    <script type="module">
        import { generatePacificWindData } from './src/utils/windDataLoader.js';
        
        const windData = generatePacificWindData();
        
        const output = document.getElementById('output');
        output.textContent = JSON.stringify({
            'uData 类型': windData.uData.constructor.name,
            'vData 类型': windData.vData.constructor.name,
            'uData 是数组': Array.isArray(windData.uData),
            'vData 是数组': Array.isArray(windData.vData),
            'uData 长度': windData.uData.length,
            'vData 长度': windData.vData.length,
            'uData 前5个': windData.uData.slice(0, 5),
            'vData 前5个': windData.vData.slice(0, 5),
            '完整数据': windData
        }, null, 2);
    </script>
</body>
</html>
