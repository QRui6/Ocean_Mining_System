<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>测试点到点航线规划</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #1e293b; color: white; }
        .container { max-width: 800px; margin: 0 auto; }
        button { padding: 10px 20px; background: #8b5cf6; color: white; border: none; border-radius: 4px; cursor: pointer; margin: 10px 5px; }
        button:hover { background: #7c3aed; }
        .result { background: #334155; padding: 15px; border-radius: 8px; margin-top: 20px; }
        input { padding: 8px; margin: 5px; background: #475569; border: 1px solid #64748b; color: white; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🗺️ 点到点航线规划测试</h1>
        
        <div>
            <h3>起始点</h3>
            <input type="number" id="startLng" placeholder="经度" value="113.571144" step="0.000001">
            <input type="number" id="startLat" placeholder="纬度" value="22.844316" step="0.000001">
        </div>
        
        <div>
            <h3>结束点</h3>
            <input type="number" id="endLng" placeholder="经度" value="121.58414" step="0.000001">
            <input type="number" id="endLat" placeholder="纬度" value="31.37979" step="0.000001">
        </div>
        
        <button onclick="testRoute()">测试规划</button>
        
        <div id="result" class="result" style="display:none;"></div>
    </div>

    <script>
        async function testRoute() {
            const startLng = document.getElementById('startLng').value;
            const startLat = document.getElementById('startLat').value;
            const endLng = document.getElementById('endLng').value;
            const endLat = document.getElementById('endLat').value;
            
            const startPoint = `${startLng},${startLat}`;
            const endPoint = `${endLng},${endLat}`;
            
            const apiKey = '12687430e166478dba18ab327fd066a2';
            const url = `https://api.shipxy.com/apicall/v3/PlanRouteByPoint?key=${apiKey}&start_point=${startPoint}&end_point=${endPoint}`;
            
            console.log('请求URL:', url);
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                
                const resultDiv = document.getElementById('result');
                resultDiv.style.display = 'block';
                
                if (data.status === 0) {
                    resultDiv.innerHTML = `
                        <h3>✅ 规划成功</h3>
                        <p><strong>距离:</strong> ${data.data.distance} 海里</p>
                        <p><strong>航点数量:</strong> ${data.data.route.length} 个</p>
                        <p><strong>前3个航点:</strong></p>
                        <pre>${JSON.stringify(data.data.route.slice(0, 3), null, 2)}</pre>
                    `;
                } else {
                    resultDiv.innerHTML = `<h3>❌ 失败</h3><p>${data.msg}</p>`;
                }
            } catch (err) {
                document.getElementById('result').innerHTML = `<h3>❌ 错误</h3><p>${err.message}</p>`;
            }
        }
    </script>
</body>
</html>
